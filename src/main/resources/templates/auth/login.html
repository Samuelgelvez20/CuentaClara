<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuentaClara — Iniciar Sesión</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f9; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
        h1 { margin-top: 0; color: #0f172a; font-size: 1.5rem; }
        label { display: block; margin-top: 1rem; font-weight: 600; font-size: 0.9rem; }
        input { width: 100%; padding: 0.65rem; margin-top: 0.35rem; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; margin-top: 1.5rem; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .alert-error { background: #fee2e2; color: #991b1b; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
        .footer { margin-top: 1.25rem; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="card">
    <h1>CuentaClara</h1>
    <p>Tus facturas y gastos consultables con evidencia real.</p>
    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>
    <form method="post" action="/auth/login">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" required placeholder="tu@correo.co">

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required>

        <button type="submit">Iniciar sesión</button>
    </form>
    <div class="footer">
        ¿No tienes cuenta? <a href="/auth/register">Regístrate aquí</a>
    </div>
</div>
</body>
</html>
