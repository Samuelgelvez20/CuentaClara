<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuentaClara — Crear Cuenta</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f9; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 460px; }
        h1 { margin-top: 0; color: #0f172a; font-size: 1.5rem; }
        label { display: block; margin-top: 1rem; font-weight: 600; font-size: 0.9rem; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 0.65rem; margin-top: 0.35rem; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        .consent-box { margin-top: 1rem; padding: 0.75rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.82rem; color: #334155; }
        button { width: 100%; margin-top: 1.5rem; padding: 0.75rem; background: #16a34a; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .alert-error { background: #fee2e2; color: #991b1b; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="card">
    <h1>Crear cuenta en CuentaClara</h1>
    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>
    <form method="post" action="/auth/register">
        <label for="fullName">Nombre completo</label>
        <input id="fullName" name="fullName" type="text" required placeholder="Ej. Ana María Gómez">

        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" required placeholder="ana@correo.co">

        <label for="password">Contraseña (mínimo 8 caracteres)</label>
        <input id="password" name="password" type="password" minlength="8" required>

        <div class="consent-box">
            <label style="margin-top:0; font-weight:500;">
                <input type="checkbox" name="aiConsentAccepted" value="true" required>
                Autorizo de forma explícita (Ley 1581 de 2012) el procesamiento del texto extraído de mis comprobantes y su envío a OpenAI para indexación semántica y respuestas asistidas. Los archivos originales se eliminan tras verificar la indexación.
            </label>
        </div>

        <button type="submit">Registrarme y configurar mi perfil</button>
    </form>
    <p style="text-align:center; margin-top:1rem; font-size:0.9rem;">
        ¿Ya tienes cuenta? <a href="/auth/login">Inicia sesión</a>
    </p>
</div>
</body>
</html>
