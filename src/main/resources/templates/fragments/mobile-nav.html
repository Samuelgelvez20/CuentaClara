<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Barra flotante inferior móvil (5 tabs espaciados >= 48px para toque cómodo) -->
<nav th:fragment="bottomNav(activePage)"
     class="cc-mobile-bottom-nav lg:hidden"
     aria-label="Navegación principal móvil">
    <a href="/dashboard"
       class="cc-mobile-nav-item"
       th:classappend="${activePage == 'dashboard'} ? ' is-active' : ''"
       th:attr="aria-current=${activePage == 'dashboard'} ? 'page' : null">
        <span class="material-symbols-outlined cc-mobile-nav-icon" aria-hidden="true">calendar_month</span>
        <span class="cc-mobile-nav-label">Inicio</span>
    </a>
    <a href="/history"
       class="cc-mobile-nav-item"
       th:classappend="${activePage == 'history'} ? ' is-active' : ''"
       th:attr="aria-current=${activePage == 'history'} ? 'page' : null">
        <span class="material-symbols-outlined cc-mobile-nav-icon" aria-hidden="true">receipt_long</span>
        <span class="cc-mobile-nav-label">Gastos</span>
    </a>
    <a href="/upload"
       class="cc-mobile-nav-item"
       th:classappend="${activePage == 'upload'} ? ' is-active' : ''"
       th:attr="aria-current=${activePage == 'upload'} ? 'page' : null">
        <span class="material-symbols-outlined cc-mobile-nav-icon" aria-hidden="true">upload_file</span>
        <span class="cc-mobile-nav-label">Recibos</span>
        <span th:if="${pendingConfirmations != null and !#lists.isEmpty(pendingConfirmations)}"
              class="cc-mobile-nav-badge"
              th:text="${#lists.size(pendingConfirmations)}"></span>
    </a>
    <a href="/recommendations"
       class="cc-mobile-nav-item"
       th:classappend="${activePage == 'recommendations'} ? ' is-active' : ''"
       th:attr="aria-current=${activePage == 'recommendations'} ? 'page' : null">
        <span class="material-symbols-outlined cc-mobile-nav-icon" aria-hidden="true">auto_awesome</span>
        <span class="cc-mobile-nav-label">Plan IA</span>
    </a>
    <a href="/assistant"
       class="cc-mobile-nav-item"
       th:classappend="${activePage == 'assistant'} ? ' is-active' : ''"
       th:attr="aria-current=${activePage == 'assistant'} ? 'page' : null">
        <span class="material-symbols-outlined cc-mobile-nav-icon" aria-hidden="true">chat_bubble</span>
        <span class="cc-mobile-nav-label">Consultas</span>
    </a>
</nav>

<!-- Controles rápidos compartidos de cabecera (Deudas, Tema, Ajustes y Salir) -->
<div th:fragment="headerUtilityActions(activePage)" class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
    <a th:if="${activePage != 'profile'}"
       href="/profile"
       title="Presupuesto y deudas"
       aria-label="Presupuesto y deudas"
       class="min-w-[40px] min-h-[40px] flex items-center justify-center gap-1.5 px-2.5 sm:px-3 rounded-xl bg-surface-container border border-outline-variant/40 text-on-surface text-xs font-semibold hover:bg-surface-container-high transition-colors no-underline">
        <span class="material-symbols-outlined text-[18px] text-secondary" aria-hidden="true">savings</span>
        <span class="hidden md:inline">Deudas</span>
    </a>
    <button type="button" onclick="window.CuentaClaraTheme.toggleDarkMode()"
            title="Alternar tema claro / oscuro"
            aria-label="Alternar tema claro u oscuro"
            class="min-w-[40px] min-h-[40px] flex items-center justify-center gap-1.5 px-2.5 sm:px-3 rounded-xl bg-surface-container border border-outline-variant/40 text-on-surface text-xs font-semibold hover:bg-surface-container-high transition-colors cursor-pointer">
        <span class="material-symbols-outlined text-[18px] text-secondary" aria-hidden="true">dark_mode</span>
        <span class="hidden sm:inline">Tema</span>
    </button>
    <a th:if="${activePage != 'settings'}"
       href="/settings"
       title="Configuración"
       aria-label="Configuración"
       class="min-w-[40px] min-h-[40px] flex items-center justify-center gap-1.5 px-2.5 sm:px-3 rounded-xl bg-surface-container border border-outline-variant/40 text-on-surface text-xs font-semibold hover:bg-surface-container-high transition-colors no-underline">
        <span class="material-symbols-outlined text-[18px] text-secondary" aria-hidden="true">tune</span>
        <span class="hidden md:inline">Ajustes</span>
    </a>
    <form method="post" action="/auth/logout" class="m-0 lg:hidden">
        <button type="submit"
                title="Cerrar sesión"
                aria-label="Cerrar sesión"
                class="min-w-[40px] min-h-[40px] flex items-center justify-center px-2.5 rounded-xl bg-surface-container border border-outline-variant/40 text-on-surface-variant hover:text-error hover:border-error/40 transition-colors cursor-pointer">
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">logout</span>
        </button>
    </form>
</div>
</body>
</html>
