services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cuentaclara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cuentaclara}
      POSTGRES_USER: ${DB_ADMIN_USER:-cuentaclara_owner}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-owner_secret_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-cuentaclara_owner} -d ${DB_NAME:-cuentaclara}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cuentaclara-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    container_name: cuentaclara-clamav
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
  clamav_data:
