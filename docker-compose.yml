services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cuentaclara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cuentaclara}
      POSTGRES_USER: ${DB_ADMIN_USER:-cuentaclara_owner}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-owner_secret_dev}
    ports:
      - "${DB_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-cuentaclara_owner} -d ${DB_NAME:-cuentaclara}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cuentaclara-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    container_name: cuentaclara-clamav
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    profiles:
      - full

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cuentaclara-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-cuentaclara}
      SPRING_DATASOURCE_USERNAME: ${DB_APP_USER:-cuentaclara_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD:-app_secret_dev}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-cuentaclara}
      SPRING_FLYWAY_USER: ${DB_ADMIN_USER:-cuentaclara_owner}
      SPRING_FLYWAY_PASSWORD: ${DB_ADMIN_PASSWORD:-owner_secret_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-c3VwZXItc2VjcmV0LWtleS1mb3ItY3VlbnRhY2xhcmEtZGV2LW1pbmltdW0tMzItYnl0ZXM=}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TEMP_STORAGE_DIR: /tmp/cuentaclara-uploads
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      WORKER_CONSUMER_ENABLED: "false"
      WORKER_INLINE_ASYNC_FALLBACK: "false"
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_VERSION: ${OPENAI_EMBEDDING_VERSION:-v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.8-flash}
      AI_DAILY_USER_CALL_LIMIT: ${AI_DAILY_USER_CALL_LIMIT:-60}
    volumes:
      - cuentaclara_uploads:/tmp/cuentaclara-uploads
    profiles:
      - full

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cuentaclara-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-cuentaclara}
      SPRING_DATASOURCE_USERNAME: ${DB_APP_USER:-cuentaclara_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD:-app_secret_dev}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-cuentaclara}
      SPRING_FLYWAY_USER: ${DB_ADMIN_USER:-cuentaclara_owner}
      SPRING_FLYWAY_PASSWORD: ${DB_ADMIN_PASSWORD:-owner_secret_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEMP_STORAGE_DIR: /tmp/cuentaclara-uploads
      WORKER_CONSUMER_ENABLED: "true"
      WORKER_INLINE_ASYNC_FALLBACK: "false"
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_VERSION: ${OPENAI_EMBEDDING_VERSION:-v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.8-flash}
      AI_DAILY_USER_CALL_LIMIT: ${AI_DAILY_USER_CALL_LIMIT:-60}
    volumes:
      - cuentaclara_uploads:/tmp/cuentaclara-uploads
    profiles:
      - full

  nginx:
    image: nginx:1.27-alpine
    container_name: cuentaclara-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTP_PORT:-8088}:80"
    command:
      - sh
      - -c
      - |
        if [ ! -f /etc/nginx/certs/cert.pem ]; then
          mkdir -p /etc/nginx/certs &&
          apk add --no-cache openssl >/dev/null &&
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /etc/nginx/certs/key.pem \
            -out /etc/nginx/certs/cert.pem \
            -subj '/CN=localhost';
        fi &&
        exec nginx -g 'daemon off;'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/certs
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
  clamav_data:
  cuentaclara_uploads:
  nginx_certs:
